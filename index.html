<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEWWORLD DESIGNER · 01</title>
<style>
:root{
  color-scheme:dark;
  --bg:#101722;--panel:#182332;--panel2:#202e3e;--line:#34475d;
  --text:#e8eef7;--muted:#91a4bb;--blue:#75b8ff;--gold:#f3c66c;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 Inter,"Segoe UI",Arial,sans-serif}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 258px;grid-template-rows:54px minmax(0,1fr)}
.header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:#151f2c;border-bottom:1px solid #2b3b4e;z-index:10}
.brand{font-weight:800;letter-spacing:.045em}.version{font-size:12px;color:var(--muted)}
.header-actions{display:flex;gap:7px;margin-left:14px}
.tool{border:1px solid #40546c;background:#202e3e;color:#d9e7f6;border-radius:7px;padding:7px 11px;font-size:12px;cursor:pointer}
.tool:hover:not(:disabled){border-color:var(--blue);background:#263b51}
.tool:disabled{opacity:.35;cursor:default}
.header-hint{margin-left:auto;color:var(--muted);font-size:11px}
.workspace{position:relative;overflow:hidden;touch-action:none;background-color:#0e1621;background-image:radial-gradient(#30445b 1px,transparent 1px);background-size:24px 24px}
.workspace:focus{outline:none}
.wires{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:#83baff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.94}
.wire.preview{stroke:var(--gold);stroke-dasharray:6 5}
.wire-mid{fill:var(--gold);stroke:#0e1621;stroke-width:2;pointer-events:all;cursor:default}
.node{position:absolute;z-index:3;width:218px;min-height:112px;border:1px solid #6683a2;border-radius:10px;background:#1b2938;box-shadow:0 8px 24px #0005;user-select:none}
.node.selected{outline:2px solid var(--blue);outline-offset:2px}
.node-head{height:39px;padding:0 9px 0 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #354b61;border-radius:9px 9px 0 0;background:#23364a;cursor:grab;touch-action:none}
.node-head:active{cursor:grabbing}
.node-type{font-size:9px;letter-spacing:.1em;color:#a9c9e8;font-weight:800}
.node-title{font-size:13px;font-weight:700;flex:1}
.node-id{font-size:10px;color:#8da6bf}
.node-delete{width:22px;height:22px;border:0;border-radius:5px;background:transparent;color:#9fb2c8;font-size:17px;line-height:1;cursor:pointer}
.node-delete:hover{background:#573b45;color:#fff}
.node-body{padding:13px 14px 12px;display:flex;align-items:center;justify-content:space-between;color:#c8d5e4;font-size:12px}
.node-sub{padding:0 14px 12px;color:#8198b1;font-size:10px}
.port{position:absolute;width:15px;height:15px;border-radius:50%;background:#152331;border:2px solid var(--gold);box-shadow:0 0 0 2px #0e1621;z-index:5;transform:translateY(-50%);cursor:crosshair}
.port.in{left:-8px}.port.out{right:-8px;border-color:var(--blue)}
.port:hover{filter:brightness(1.35);transform:translateY(-50%) scale(1.12)}
.shelf{background:#172230;border-left:1px solid #2b3b4e;padding:15px 14px;overflow:auto;z-index:10}
.shelf h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#a9bbcf;margin:2px 0 12px}
.module{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #40546c;border-radius:9px;background:#202e3e;cursor:grab;user-select:none;touch-action:none;margin-bottom:8px}
.module:active{cursor:grabbing}
.module-icon{width:29px;height:29px;border-radius:7px;background:#29425a;display:grid;place-items:center;color:#a9d4ff;font-weight:800;font-size:16px;flex:none}
.module strong{display:block;font-size:12px}.module small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.shelf-note{margin:12px 0;color:#8397ad;font-size:10px;line-height:1.55}
.ghost{position:fixed;z-index:1000;pointer-events:none;padding:11px 14px;border:1px solid var(--blue);border-radius:9px;background:#23364a;box-shadow:0 12px 32px #0008;opacity:.96;font-weight:700;color:#e8eef7;min-width:150px}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#71859c;text-align:center;pointer-events:none;z-index:1}
.empty strong{display:block;color:#a9bbcf;font-size:16px;margin-bottom:7px}.empty span{font-size:12px}
.toast{position:absolute;left:18px;bottom:16px;padding:8px 11px;background:#1c2b3b;border:1px solid #3b526c;border-radius:7px;color:#a9bbcf;font-size:11px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:20}
.toast.show{opacity:1}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr) 205px}.header-hint{display:none}.shelf{padding:12px 9px}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">NEWWORLD DESIGNER</div>
    <div class="version">01 · clean foundation</div>
    <div class="header-actions">
      <button class="tool" id="undoButton" disabled title="Visszavonás · Ctrl+Z">↶ Undo</button>
      <button class="tool" id="redoButton" disabled title="Újra · Ctrl+Shift+Z">↷ Redo</button>
    </div>
    <div class="header-hint">Oldalak · kapcsolatok · objektumkerülő Path</div>
  </header>

  <main class="workspace" id="workspace" tabindex="0">
    <svg class="wires" id="wires" aria-hidden="true"></svg>
    <div class="empty" id="emptyMessage">
      <div><strong>Üres munkaterület</strong><span>Húzd be jobbról az „Oldal” modult a kezdéshez.</span></div>
    </div>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="shelf">
    <h2>Modultár</h2>
    <div class="module" data-module="page">
      <div class="module-icon">▱</div>
      <div><strong>Oldal</strong><small>Üres, alakítható oldalnode</small></div>
    </div>
    <div class="shelf-note">Húzd az Oldal modult a munkaterületre. Az oldalnode-ok szabadon mozgathatók és összeköthetők.</div>
  </aside>
</div>

<script>
(() => {
  'use strict';

  // ============================================================
  // 01. DOMAIN STATE — only data, no DOM references.
  // ============================================================
  const initialState = () => ({
    nodes: [],
    links: [],
    nextNodeNumber: 1,
    nextLinkNumber: 1
  });

  let state = initialState();

  // ============================================================
  // 02. UI STATE — temporary gestures never enter undo history.
  // ============================================================
  const ui = {
    shelfDrag: null,
    nodeDrag: null,
    connection: null
  };

  const workspace = document.getElementById('workspace');
  const wires = document.getElementById('wires');
  const emptyMessage = document.getElementById('emptyMessage');
  const toastElement = document.getElementById('toast');
  const undoButton = document.getElementById('undoButton');
  const redoButton = document.getElementById('redoButton');

  const NODE_WIDTH = 218;
  const NODE_MIN_HEIGHT = 112;
  const PORT_SPACING = 24;
  const GRID = 12;
  const SVG_NS = 'http://www.w3.org/2000/svg';

  let toastTimer = null;
  let history = [];
  let historyIndex = -1;

  // ============================================================
  // 03. HISTORY — one completed user action = one history entry.
  // ============================================================
  function serializableState() {
    return {
      nodes: state.nodes.map(({id, number, x, y, title}) => ({id, number, x, y, title})),
      links: state.links.map(link => ({...link})),
      nextNodeNumber: state.nextNodeNumber,
      nextLinkNumber: state.nextLinkNumber
    };
  }

  function pushHistory() {
    history = history.slice(0, historyIndex + 1);
    history.push(JSON.stringify(serializableState()));
    if (history.length > 100) history.shift();
    historyIndex = history.length - 1;
    updateHistoryButtons();
  }

  function restoreHistory(index) {
    if (index < 0 || index >= history.length) return;
    state = JSON.parse(history[index]);
    historyIndex = index;
    clearGestures();
    renderAll();
    updateHistoryButtons();
  }

  function undo() {
    if (historyIndex > 0) {
      restoreHistory(historyIndex - 1);
      showToast('Visszavonva');
    }
  }

  function redo() {
    if (historyIndex < history.length - 1) {
      restoreHistory(historyIndex + 1);
      showToast('Újra végrehajtva');
    }
  }

  function updateHistoryButtons() {
    undoButton.disabled = historyIndex <= 0;
    redoButton.disabled = historyIndex >= history.length - 1;
  }

  undoButton.addEventListener('click', undo);
  redoButton.addEventListener('click', redo);

  document.addEventListener('keydown', event => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
      event.preventDefault();
      event.shiftKey ? redo() : undo();
    } else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'y') {
      event.preventDefault();
      redo();
    }
  });

  // ============================================================
  // 04. MODEL HELPERS — stable node/link identifiers.
  // ============================================================
  const getNode = id => state.nodes.find(node => node.id === id);
  const getLink = id => state.links.find(link => link.id === id);

  function getUsedPortIndexes(nodeId, side) {
    const used = state.links
      .filter(link => side === 'out' ? link.fromNode === nodeId : link.toNode === nodeId)
      .map(link => side === 'out' ? link.fromPort : link.toPort);
    return [...new Set(used)].sort((a, b) => a - b);
  }

  // Ports are allocated contiguously. The final index is always free.
  function getPortCount(nodeId, side) {
    return getUsedPortIndexes(nodeId, side).length + 1;
  }

  function normalizePorts() {
    state.nodes.forEach(node => {
      for (const side of ['out', 'in']) {
        const connectedLinks = state.links
          .filter(link => side === 'out' ? link.fromNode === node.id : link.toNode === node.id)
          .sort((a, b) => (side === 'out' ? a.fromPort - b.fromPort : a.toPort - b.toPort));

        connectedLinks.forEach((link, index) => {
          if (side === 'out') link.fromPort = index;
          else link.toPort = index;
        });
      }
    });
  }

  function nodeHeight(node) {
    return Math.max(
      NODE_MIN_HEIGHT,
      76 + Math.max(getPortCount(node.id, 'in'), getPortCount(node.id, 'out')) * PORT_SPACING
    );
  }

  // ============================================================
  // 05. PAGE MODULE — create, move, delete.
  // ============================================================
  function addPageAt(x, y) {
    const number = state.nextNodeNumber++;
    const node = {
      id: `page_${number}`,
      number,
      title: `Oldal ${number}`,
      x: Math.max(12, x - NODE_WIDTH / 2),
      y: Math.max(72, y - 35)
    };
    state.nodes.push(node);
    renderAll();
    pushHistory();
    showToast(`${node.title} hozzáadva`);
  }

  function deletePage(nodeId) {
    const node = getNode(nodeId);
    if (!node) return;
    state.nodes = state.nodes.filter(item => item.id !== nodeId);
    state.links = state.links.filter(link => link.fromNode !== nodeId && link.toNode !== nodeId);
    normalizePorts();
    renderAll();
    pushHistory();
    showToast(`${node.title} és kapcsolatai törölve`);
  }

  // ============================================================
  // 06. CONNECTION MODULE — output -> input.
  // ============================================================
  function createConnection(source, target) {
    if (source.side !== 'out' || target.side !== 'in') {
      showToast('Kimenetet bemenettel kapcsolj össze');
      return;
    }
    if (source.nodeId === target.nodeId) {
      showToast('Egy oldal önmagához nem kapcsolható');
      return;
    }

    const sourceOccupied = state.links.some(link =>
      link.fromNode === source.nodeId && link.fromPort === source.portIndex
    );
    const targetOccupied = state.links.some(link =>
      link.toNode === target.nodeId && link.toPort === target.portIndex
    );
    if (sourceOccupied || targetOccupied) {
      showToast('Ez a csatlakozási pont már foglalt. Használd a mellette megjelent szabad portot.');
      return;
    }

    state.links.push({
      id: `path_${state.nextLinkNumber++}`,
      fromNode: source.nodeId,
      fromPort: source.portIndex,
      toNode: target.nodeId,
      toPort: target.portIndex
    });

    normalizePorts();
    renderAll();
    pushHistory();
    showToast('Path létrehozva');
  }

  // ============================================================
  // 07. PORT VIEW — occupied ports remain; one free port follows.
  // ============================================================
  function renderPorts(node, element) {
    element.querySelectorAll('.port').forEach(port => port.remove());
    const height = nodeHeight(node);
    element.style.height = `${height}px`;

    for (const side of ['in', 'out']) {
      const count = getPortCount(node.id, side);
      for (let index = 0; index < count; index++) {
        const port = document.createElement('div');
        port.className = `port ${side}`;
        port.dataset.side = side;
        port.dataset.portIndex = String(index);
        port.title = `${side === 'in' ? 'Bemenet' : 'Kimenet'} ${index + 1}`;
        port.style.top = `${height / 2 + (index - (count - 1) / 2) * PORT_SPACING}px`;

        port.addEventListener('pointerdown', event => {
          event.preventDefault();
          event.stopPropagation();
          ui.connection = {
            nodeId: node.id,
            side,
            portIndex: index,
            cursor: null
          };
          drawPaths();
        });
        element.appendChild(port);
      }
    }
  }

  // ============================================================
  // 08. NODE VIEW — recreated from domain state.
  // ============================================================
  function renderNode(node) {
    const element = document.createElement('section');
    element.className = 'node';
    element.dataset.nodeId = node.id;
    element.style.left = `${node.x}px`;
    element.style.top = `${node.y}px`;

    element.innerHTML = `
      <div class="node-head">
        <span class="node-type">OLDAL</span>
        <span class="node-title"></span>
        <span class="node-id"></span>
        <button class="node-delete" title="Oldal törlése">×</button>
      </div>
      <div class="node-body"><span>▤ &nbsp;Tartalmi oldal</span><span></span></div>
      <div class="node-sub">Tartalom még nincs hozzárendelve</div>
    `;

    element.querySelector('.node-title').textContent = node.title;
    element.querySelector('.node-id').textContent = `P${node.number}`;
    element.querySelector('.node-delete').addEventListener('pointerdown', event => event.stopPropagation());
    element.querySelector('.node-delete').addEventListener('click', event => {
      event.stopPropagation();
      deletePage(node.id);
    });

    element.addEventListener('pointerdown', event => {
      if (event.target.closest('.node-delete') || event.target.classList.contains('port')) return;
      if (!event.target.closest('.node-head')) return;

      event.preventDefault();
      document.querySelectorAll('.node').forEach(item => item.classList.remove('selected'));
      element.classList.add('selected');

      const point = localPoint(event.clientX, event.clientY);
      ui.nodeDrag = {
        nodeId: node.id,
        offsetX: point.x - node.x,
        offsetY: point.y - node.y,
        originalX: node.x,
        originalY: node.y
      };
    });

    workspace.appendChild(element);
    renderPorts(node, element);
  }

  // ============================================================
  // 09. PATH ROUTER — A* orthogonal routing around node rectangles.
  //      This module owns route geometry; node rendering does not.
  // ============================================================
  function getPortPoint(nodeId, side, portIndex) {
    const node = getNode(nodeId);
    const element = workspace.querySelector(`.node[data-node-id="${nodeId}"]`);
    if (!node || !element) return {x: 0, y: 0};

    const port = element.querySelector(`.port.${side}[data-port-index="${portIndex}"]`);
    if (!port) return {x: node.x + (side === 'out' ? NODE_WIDTH : 0), y: node.y + nodeHeight(node) / 2};

    const portRect = port.getBoundingClientRect();
    const workspaceRect = workspace.getBoundingClientRect();
    return {
      x: portRect.left + portRect.width / 2 - workspaceRect.left,
      y: portRect.top + portRect.height / 2 - workspaceRect.top
    };
  }

  function obstacleRects(excludedNodeIds) {
    const workspaceRect = workspace.getBoundingClientRect();
    return state.nodes
      .filter(node => !excludedNodeIds.includes(node.id))
      .map(node => {
        const element = workspace.querySelector(`.node[data-node-id="${node.id}"]`);
        if (!element) return null;
        const rect = element.getBoundingClientRect();
        const padding = 16;
        return {
          left: rect.left - workspaceRect.left - padding,
          top: rect.top - workspaceRect.top - padding,
          right: rect.right - workspaceRect.left + padding,
          bottom: rect.bottom - workspaceRect.top + padding
        };
      })
      .filter(Boolean);
  }

  function routeAroundNodes(start, end, excludedNodeIds) {
    const lead = 24;
    const a = {x: start.x + lead, y: start.y};
    const b = {x: end.x - lead, y: end.y};
    const width = workspace.clientWidth;
    const height = workspace.clientHeight;
    const obstacles = obstacleRects(excludedNodeIds);

    const snap = value => Math.round(value / GRID) * GRID;
    const sx = snap(a.x), sy = snap(a.y), ex = snap(b.x), ey = snap(b.y);
    const key = (x, y, dir) => `${x},${y},${dir}`;
    const isBlocked = (x, y) => obstacles.some(rect =>
      x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom
    );

    const directions = [[1,0],[-1,0],[0,1],[0,-1]];
    const open = [{x:sx,y:sy,dir:-1,g:0,f:Math.abs(ex-sx)+Math.abs(ey-sy),path:[]}];
    const best = new Map();
    let found = null;
    let iterations = 0;

    while (open.length && iterations++ < 9000) {
      open.sort((left, right) => left.f - right.f);
      const current = open.shift();
      const currentKey = key(current.x,current.y,current.dir);
      if (best.has(currentKey) && best.get(currentKey) <= current.g) continue;
      best.set(currentKey,current.g);

      if (Math.abs(current.x-ex) <= GRID && Math.abs(current.y-ey) <= GRID) {
        found = current;
        break;
      }

      directions.forEach(([dx,dy],directionIndex) => {
        const x = current.x + dx*GRID;
        const y = current.y + dy*GRID;
        if (x < 8 || y < 8 || x > width-8 || y > height-8 || isBlocked(x,y)) return;

        const turnCost = current.dir !== -1 && current.dir !== directionIndex ? 10 : 0;
        const g = current.g + GRID + turnCost;
        const k = key(x,y,directionIndex);
        if (best.has(k) && best.get(k) <= g) return;

        open.push({
          x,y,dir:directionIndex,g,
          f:g+Math.abs(ex-x)+Math.abs(ey-y),
          path:current.path.concat([[x,y]])
        });
      });
    }

    if (!found) {
      const bendX = (a.x+b.x)/2;
      return `M ${start.x} ${start.y} C ${a.x} ${a.y}, ${bendX} ${a.y}, ${bendX} ${(a.y+b.y)/2} S ${b.x} ${b.y}, ${end.x} ${end.y}`;
    }

    let points = [[a.x,a.y], ...found.path, [b.x,b.y]];
    points = points.filter((point,index) => index === 0 ||
      point[0] !== points[index-1][0] || point[1] !== points[index-1][1]);

    const simplified = [];
    for (const point of points) {
      simplified.push(point);
      while (simplified.length >= 3) {
        const A=simplified[simplified.length-3], B=simplified[simplified.length-2], C=simplified[simplified.length-1];
        if ((A[0]===B[0] && B[0]===C[0]) || (A[1]===B[1] && B[1]===C[1])) simplified.splice(simplified.length-2,1);
        else break;
      }
    }

    let d = `M ${start.x} ${start.y} L ${a.x} ${a.y}`;
    for (let i=1;i<simplified.length-1;i++) {
      const A=simplified[i-1], B=simplified[i], C=simplified[i+1];
      const v1={x:B[0]-A[0],y:B[1]-A[1]}, v2={x:C[0]-B[0],y:C[1]-B[1]};
      const len1=Math.hypot(v1.x,v1.y)||1, len2=Math.hypot(v2.x,v2.y)||1;
      const radius=Math.min(10,len1/2,len2/2);
      const p1={x:B[0]-v1.x/len1*radius,y:B[1]-v1.y/len1*radius};
      const p2={x:B[0]+v2.x/len2*radius,y:B[1]+v2.y/len2*radius};
      d += ` L ${p1.x} ${p1.y} Q ${B[0]} ${B[1]} ${p2.x} ${p2.y}`;
    }
    const last=simplified[simplified.length-1];
    d += ` L ${last[0]} ${last[1]} L ${end.x} ${end.y}`;
    return d;
  }

  // ============================================================
  // 10. PATH VIEW — path line and its midpoint marker.
  // ============================================================
  function drawPaths() {
    const rect = workspace.getBoundingClientRect();
    wires.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
    wires.innerHTML = '';

    state.links.forEach(link => {
      const start = getPortPoint(link.fromNode,'out',link.fromPort);
      const end = getPortPoint(link.toNode,'in',link.toPort);
      const pathData = routeAroundNodes(start,end,[link.fromNode,link.toNode]);
      const path = document.createElementNS(SVG_NS,'path');
      path.setAttribute('d',pathData);
      path.setAttribute('class','wire');
      wires.appendChild(path);

      try {
        const middle = path.getPointAtLength(path.getTotalLength()/2);
        const marker = document.createElementNS(SVG_NS,'circle');
        marker.setAttribute('cx',middle.x);
        marker.setAttribute('cy',middle.y);
        marker.setAttribute('r','5');
        marker.setAttribute('class','wire-mid');
        marker.setAttribute('data-link-id',link.id);
        wires.appendChild(marker);
      } catch (_) {}
    });

    if (ui.connection && ui.connection.cursor) {
      const start = getPortPoint(ui.connection.nodeId,ui.connection.side,ui.connection.portIndex);
      const end = ui.connection.cursor;
      const path = document.createElementNS(SVG_NS,'path');
      const d = ui.connection.side === 'out'
        ? `M ${start.x} ${start.y} C ${start.x+60} ${start.y}, ${end.x-60} ${end.y}, ${end.x} ${end.y}`
        : `M ${end.x} ${end.y} C ${end.x+60} ${end.y}, ${start.x-60} ${start.y}, ${start.x} ${start.y}`;
      path.setAttribute('d',d);
      path.setAttribute('class','wire preview');
      wires.appendChild(path);
    }
  }

  // ============================================================
  // 11. RENDER ORCHESTRATOR — rebuild UI from domain state.
  // ============================================================
  function renderAll() {
    workspace.querySelectorAll('.node').forEach(element => element.remove());
    state.nodes.forEach(renderNode);
    emptyMessage.style.display = state.nodes.length ? 'none' : 'grid';
    drawPaths();
  }

  function localPoint(clientX,clientY) {
    const rect = workspace.getBoundingClientRect();
    return {x:clientX-rect.left,y:clientY-rect.top};
  }

  function showToast(message) {
    toastElement.textContent = message;
    toastElement.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastElement.classList.remove('show'),1700);
  }

  // ============================================================
  // 12. MODULE SHELF — drag only creates a page on valid drop.
  // ============================================================
  function startShelfDrag(module,event) {
    event.preventDefault();
    const ghost = document.createElement('div');
    ghost.className = 'ghost';
    ghost.textContent = '▱  Új oldal';
    document.body.appendChild(ghost);
    ui.shelfDrag = {ghost};
    moveShelfGhost(event.clientX,event.clientY);
  }

  function moveShelfGhost(x,y) {
    if (!ui.shelfDrag) return;
    ui.shelfDrag.ghost.style.left = `${x+12}px`;
    ui.shelfDrag.ghost.style.top = `${y+12}px`;
  }

  function finishShelfDrag(event,cancelled=false) {
    if (!ui.shelfDrag) return;
    const drag = ui.shelfDrag;
    ui.shelfDrag = null;
    if (drag.ghost.isConnected) drag.ghost.remove();
    if (cancelled) return;

    const rect = workspace.getBoundingClientRect();
    const inside = event.clientX >= rect.left && event.clientX <= rect.right &&
                   event.clientY >= rect.top && event.clientY <= rect.bottom;
    if (!inside) return;

    const point = localPoint(event.clientX,event.clientY);
    addPageAt(point.x,point.y);
  }

  document.querySelectorAll('.module[data-module="page"]').forEach(module => {
    module.addEventListener('pointerdown',event => startShelfDrag(module,event));
  });

  // ============================================================
  // 13. GLOBAL POINTER LIFECYCLE — every gesture terminates safely.
  // ============================================================
  document.addEventListener('pointermove',event => {
    if (ui.shelfDrag) {
      moveShelfGhost(event.clientX,event.clientY);
      return;
    }

    if (ui.nodeDrag) {
      const node = getNode(ui.nodeDrag.nodeId);
      if (!node) return;
      const point = localPoint(event.clientX,event.clientY);
      node.x = Math.max(0,point.x-ui.nodeDrag.offsetX);
      node.y = Math.max(64,point.y-ui.nodeDrag.offsetY);
      const element = workspace.querySelector(`.node[data-node-id="${node.id}"]`);
      if (element) {
        element.style.left = `${node.x}px`;
        element.style.top = `${node.y}px`;
      }
      drawPaths();
      return;
    }

    if (ui.connection) {
      ui.connection.cursor = localPoint(event.clientX,event.clientY);
      drawPaths();
    }
  });

  document.addEventListener('pointerup',event => {
    if (ui.shelfDrag) {
      finishShelfDrag(event,false);
      return;
    }

    if (ui.nodeDrag) {
      const drag = ui.nodeDrag;
      ui.nodeDrag = null;
      const node = getNode(drag.nodeId);
      if (node && (node.x !== drag.originalX || node.y !== drag.originalY)) pushHistory();
      return;
    }

    if (ui.connection) {
      const source = {...ui.connection};
      ui.connection = null;
      const hit = document.elementFromPoint(event.clientX,event.clientY);
      const targetPort = hit && hit.closest('.port');
      if (targetPort) {
        const targetNode = targetPort.closest('.node');
        createConnection(source,{
          nodeId:targetNode.dataset.nodeId,
          side:targetPort.dataset.side,
          portIndex:Number(targetPort.dataset.portIndex)
        });
      } else {
        drawPaths();
      }
    }
  });

  function clearGestures() {
    if (ui.shelfDrag && ui.shelfDrag.ghost.isConnected) ui.shelfDrag.ghost.remove();
    ui.shelfDrag = null;
    ui.nodeDrag = null;
    ui.connection = null;
  }

  document.addEventListener('pointercancel',() => {
    clearGestures();
    drawPaths();
  });

  window.addEventListener('blur',() => {
    clearGestures();
    drawPaths();
  });

  window.addEventListener('resize',drawPaths);

  // Initial baseline: empty workspace is the first undo-history state.
  pushHistory();
  renderAll();
})();
</script>
</body>
</html>
